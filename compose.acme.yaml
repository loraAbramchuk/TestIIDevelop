services:
  web:
    ports: !override
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${HTTP_PUBLIC_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.acme.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${ACME_WEBROOT:-./.local/acme}:/var/www/acme:ro
    healthcheck:
      test: [CMD, wget, -Y, "off", -q, -O, /dev/null, "http://127.0.0.1/_acme_ready"]
