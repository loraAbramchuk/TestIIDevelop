# Docker Compose >= 2.24.4 is required for !override.
services:
  app:
    environment:
      AUTH_COOKIE_SECURE: "true"
  web:
    ports: !override
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${HTTP_PUBLIC_PORT:-80}:80"
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN before enabling HTTPS}
      HSTS_HEADER: max-age=31536000
      PUBLIC_HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      - ./deploy/nginx.production.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_ROOT:-./.local/letsencrypt}:/etc/letsencrypt:ro
      - ${ACME_WEBROOT:-./.local/acme}:/var/www/acme:ro
    healthcheck:
      test: [CMD, wget, -Y, "off", -q, -O, /dev/null, "http://127.0.0.1:8081/health/ready"]
