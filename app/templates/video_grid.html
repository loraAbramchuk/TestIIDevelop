<section class="video-grid" aria-label="Видео">
  {% for video in page['items'] %}
    <article class="video-card">
      <a class="card-preview" href="/watch/{{ video.id }}"><img src="{{ video.thumbnail_url }}" alt="Превью: {{ video.title }}" loading="lazy"></a>
      <div class="card-body">
        <h2><a href="/watch/{{ video.id }}">{{ video.title }}</a></h2>
        <a data-channel-label data-channel-id="{{ video.author.id }}" href="/channels/{{ video.author.id }}">{{ video.author.name }}</a>
        <p class="hint">{{ video.duration_seconds|round(1) }} с{% if video.visibility == 'private' %} · Приватное видео{% endif %}</p>
      </div>
    </article>
  {% endfor %}
</section>
