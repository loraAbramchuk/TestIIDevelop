<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
    <script src="{{ url_for('static', path='/auth.js') }}" defer></script>
    {% block scripts %}{% endblock %}
  </head>
  <body>
    <header>
      <a class="brand" href="/">{{ app_name }}</a>
      <form class="site-search" action="/search" method="get" role="search">
        <input type="search" name="q" maxlength="200" aria-label="Поиск по названию" placeholder="Поиск видео" value="{{ search_query|default('') }}">
        <button type="submit">Найти</button>
      </form>
      <nav aria-label="Аккаунт">
        {% if user %}
          <a href="/upload">Загрузить</a>
          <a href="/studio">Мои видео</a>
          <a href="/my-channel">Мой канал</a>
          <a href="/subscriptions">Подписки</a>
          <a href="/my-playlists">Плейлисты</a>
          {% if user.role in ['moderator', 'admin'] %}<a href="/moderation">Модерация</a>{% endif %}
          <span class="account-name">{{ user.display_name }}</span>
          <button type="button" id="logout">Выйти</button>
        {% else %}
          <a href="/login{% if next_path is defined %}?next={{ next_path|urlencode }}{% endif %}">Войти</a>
          <a href="/register{% if next_path is defined %}?next={{ next_path|urlencode }}{% endif %}">Регистрация</a>
        {% endif %}
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <p id="session-error" role="alert" class="error"></p>
  </body>
</html>
