name: video-platform

x-app: &app
  image: video-platform-app:local
  build: .
  environment:
    DB_HOST: db
    POSTGRES_DB: ${POSTGRES_DB:-video}
    POSTGRES_USER: ${POSTGRES_USER:-video}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bash scripts/start.sh to create .env}
    MEDIA_ROOT: /data/media
    AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    SESSION_LIFETIME_HOURS: ${SESSION_LIFETIME_HOURS:-336}
    MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-1073741824}
    OWNER_MEDIA_QUOTA_BYTES: ${OWNER_MEDIA_QUOTA_BYTES:-10737418240}
    MEDIA_CAPACITY_BYTES: ${MEDIA_CAPACITY_BYTES:-107374182400}
    MEDIA_MIN_FREE_BYTES: ${MEDIA_MIN_FREE_BYTES:-2147483648}
    PREVIEW_BUDGET_BYTES: ${PREVIEW_BUDGET_BYTES:-16777216}
    MAX_UPLOADS_PER_OWNER: ${MAX_UPLOADS_PER_OWNER:-2}
    MAX_UPLOADS_TOTAL: ${MAX_UPLOADS_TOTAL:-4}
    MAX_PENDING_VIDEO_JOBS: ${MAX_PENDING_VIDEO_JOBS:-100}
    UPLOAD_IDLE_TIMEOUT_SECONDS: ${UPLOAD_IDLE_TIMEOUT_SECONDS:-60}
    UPLOAD_TIMEOUT_SECONDS: ${UPLOAD_TIMEOUT_SECONDS:-3600}
    UPLOAD_LEASE_SECONDS: ${UPLOAD_LEASE_SECONDS:-120}
    UPLOAD_HEARTBEAT_SECONDS: ${UPLOAD_HEARTBEAT_SECONDS:-15}
    PROCESSING_CONCURRENCY: ${PROCESSING_CONCURRENCY:-1}
    FFPROBE_TIMEOUT_SECONDS: ${FFPROBE_TIMEOUT_SECONDS:-30}
    PROCESSING_TIMEOUT_SECONDS: ${PROCESSING_TIMEOUT_SECONDS:-900}
    MAX_VIDEO_DURATION_SECONDS: ${MAX_VIDEO_DURATION_SECONDS:-7200}
    MAX_VIDEO_LONG_SIDE: ${MAX_VIDEO_LONG_SIDE:-1920}
    MAX_VIDEO_SHORT_SIDE: ${MAX_VIDEO_SHORT_SIDE:-1080}
    MAX_VIDEO_FPS: ${MAX_VIDEO_FPS:-60}
    VIDEO_CREATE_LIMIT_PER_HOUR: ${VIDEO_CREATE_LIMIT_PER_HOUR:-30}
    VIDEO_WRITE_LIMIT_PER_MINUTE: ${VIDEO_WRITE_LIMIT_PER_MINUTE:-120}
  volumes:
    - media:/data/media

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-video}
      POSTGRES_USER: ${POSTGRES_USER:-video}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bash scripts/start.sh to create .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app
    # Only Nginx is externally reachable; it replaces incoming forwarded headers.
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --proxy-headers, --forwarded-allow-ips, "*"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  web:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -Y, "off", -q, -O, /dev/null, "http://127.0.0.1/health/ready"]
      interval: 10s
      timeout: 6s
      retries: 6
    restart: unless-stopped

volumes:
  postgres:
  media:
